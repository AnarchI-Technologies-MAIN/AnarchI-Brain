name: Brain qualification

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: qualify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep required check names stable while pinning host generations.
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python -I -B -m unittest discover -s ci -p "test_*.py"
      - run: python -I -B -O -m unittest discover -s ci -p "test_*.py"
      - run: python -I -B ci/qualify.py
      - run: python -I -B qualification/authority-unit-b-v1.3/qualify_unit_b.py --catalog-sha256 e51c99c81c61cc1cc69ddbfd193503a1b659fcf694ffcc2d5d76cc47ba6d5792
      - run: python -I -B -O qualification/authority-unit-b-v1.3/qualify_unit_b.py --catalog-sha256 e51c99c81c61cc1cc69ddbfd193503a1b659fcf694ffcc2d5d76cc47ba6d5792
      - run: python -I -B ci/run_unit_b_tests.py
      - run: python -I -B -O ci/run_unit_b_tests.py
      - run: python -I -B qualification/unit-c-durable-claim-reference-v0.1-draft/qualify_unit_c.py --manifest-sha256 c2b8cb7d2677d4f21abcb6fd0a877457264350670603d763f1b6969ed7e6e467
      - run: python -I -B -m unittest discover -s qualification/unit-c-durable-claim-reference-v0.1-draft -p "test_*.py"
        env:
          UNIT_C_MANIFEST_SHA256: c2b8cb7d2677d4f21abcb6fd0a877457264350670603d763f1b6969ed7e6e467
      - run: python -I -B -O -m unittest discover -s qualification/unit-c-durable-claim-reference-v0.1-draft -p "test_*.py"
        env:
          UNIT_C_MANIFEST_SHA256: c2b8cb7d2677d4f21abcb6fd0a877457264350670603d763f1b6969ed7e6e467
