name: Brain M08 qualification
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m08-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  m08:
    name: M08 reference qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -I -B ci/qualify_m08.py
